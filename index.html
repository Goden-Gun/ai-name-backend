<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 取名后台</title>
    <link rel="stylesheet" href="./styles.css?v=20260609-admin-login" />
  </head>
  <body>
    <section class="login-screen" id="adminLogin">
      <div class="login-panel">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <h1>取名后台</h1>
            <p>管理员登录</p>
          </div>
        </div>
        <label>管理员密钥</label>
        <input id="adminKeyInput" type="password" autocomplete="current-password" />
        <div class="form-error" id="adminKeyError"></div>
        <button class="primary" id="adminKeySubmit">登录后台</button>
      </div>
    </section>
    <div class="shell" id="appShell" hidden>
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <h1>取名后台</h1>
            <p>运营管理台</p>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <section class="auth-panel">
          <label>API Base</label>
          <input id="apiBase" />
          <button id="saveAuth" class="primary">保存 API Base</button>
        </section>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="sectionEyebrow">Admin</p>
            <h2 id="sectionTitle">用户管理</h2>
          </div>
          <div class="topbar-actions">
            <div class="status" id="statusText">未连接</div>
            <button id="logoutAdmin">退出</button>
          </div>
        </header>
        <section id="view" class="view"></section>
      </main>
    </div>
    <script src="./app.js?v=20260609-admin-login"></script>
  </body>
</html>
